<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yaaaay 💖</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      background: black;
    }

    /* HINTERGRUNDBILD */
    .background {
      position: fixed;
      inset: 0;
      background-image: url('img8.jpg');
      background-size: cover;
      background-position: center;
      filter: brightness(0.9);
      z-index: 1;
    }

    /* TEXT BOX */
    .box {
      position: absolute;
      bottom: 10%;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 420px;
      padding: 28px;
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(12px);
      border-radius: 26px;
      text-align: center;
      color: white;
      z-index: 2;
      box-shadow: 0 20px 45px rgba(0,0,0,0.25);
    }

    h1 {
      font-size: 36px;
      margin-bottom: 14px;
      font-weight: 700;
    }

    p {
      font-size: 22px;
      line-height: 1.45;
      opacity: 0;
      transition: opacity 1.2s ease;
    }

    p.show {
      opacity: 1;
    }
  </style>
</head>

<body>

  <!-- HINTERGRUND -->
  <div class="background"></div>

  <!-- TEXT -->
  <div class="box">
    <h1>Yaaaay 💖</h1>
    <p id="text"></p>
  </div>

  <script>
    const messages = [
      "Dionisa… 💕",
      "më bëre njeriun më të lumtur në botë 🥰",
      "ndoshta jo perfekt…",
      "por ishte nga zemra ✨",
      "kthehu shpirt 💖"
    ];

    const textEl = document.getElementById("text");
    let index = 0;

    function showNextText() {
      if (index >= messages.length) return;

      textEl.classList.remove("show");
      setTimeout(() => {
        textEl.innerHTML = messages[index];
        textEl.classList.add("show");
        index++;
      }, 600);
    }

    showNextText();
    setInterval(showNextText, 5000); // langsam & ruhig
  </script>

</body>
</html>
