<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yaaaay 💖</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      background: linear-gradient(135deg, #ff9ebc, #ffd1dc);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* HINTERGRUND-BILD (GANZ SICHTBAR) */
    .background {
      position: fixed;
      inset: 0;
      background-image: url('img8.jpg');
      background-repeat: no-repeat;
      background-position: center;
      background-size: contain; /* WICHTIG: nicht mehr gezoomt */
      filter: brightness(0.95);
      z-index: 1;
    }

    /* leichte Abdunklung für Lesbarkeit */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.15);
      z-index: 2;
    }

    /* TEXT BOX */
    .box {
      position: absolute;
      bottom: 8%;
      left: 50%;
      transform: translateX(-50%);
      width: 92%;
      max-width: 420px;
      padding: 26px;
      background: rgba(255, 255, 255, 0.28);
      backdrop-filter: blur(10px);
      border-radius: 26px;
      text-align: center;
      color: white;
      z-index: 3;
      box-shadow: 0 20px 45px rgba(0,0,0,0.25);
    }

    h1 {
      font-size: 36px;
      margin-bottom: 14px;
      font-weight: 700;
    }

    p {
      font-size: 22px;
      line-height: 1.45;
      opacity: 0;
      transition: opacity 1.2s ease;
    }

    p.show {
      opacity: 1;
    }
  </style>
</head>

<body>

  <!-- Bild -->
  <div class="background"></div>
  <div class="overlay"></div>

  <!-- Text -->
  <div class="box">
    <h1>Yaaaay 💖</h1>
    <p id="text"></p>
  </div>

  <script>
    const messages = [
      "Dionisa… 💕",
      "më bon njeriun ma ta lumtur ne bote 🥰",
      "kisha pas qef me ta bo ni dhurat…"
      "ndoshta jo perfekt…",
      "por ishte nga zemra ✨",
      "kthehu shpirt 💖"
    ];

    const textEl = document.getElementById("text");
    let index = 0;

    function showNextText() {
      if (index >= messages.length) return;

      textEl.classList.remove("show");
      setTimeout(() => {
        textEl.innerHTML = messages[index];
        textEl.classList.add("show");
        index++;
      }, 600);
    }

    showNextText();
    setInterval(showNextText, 5000);
  </script>

</body>
</html>
