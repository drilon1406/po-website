<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ne ❤️</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      height: 100vh;
      width: 100vw;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .slideshow {
      position: fixed;
      inset: 0;
    }

    .slide {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transition: opacity 1.5s ease;
    }

    .slide.active {
      opacity: 1;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.25);
    }

    .text {
      position: absolute;
      bottom: 12%;
      width: 100%;
      text-align: center;
      color: white;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 0.5px;
      opacity: 0;
      transition: opacity 2s ease;
    }

    .text.show {
      opacity: 1;
    }

    @media (min-width: 600px) {
      .text {
        font-size: 34px;
      }
    }
  </style>
</head>
<body>

<div class="slideshow">
  <div class="slide active" style="background-image:url('img1.jpg')"></div>
  <div class="slide" style="background-image:url('img2.jpg')"></div>
  <div class="slide" style="background-image:url('img3.jpg')"></div>
  <div class="slide" style="background-image:url('img4.jpg')"></div>
  <div class="slide" style="background-image:url('img5.jpg')"></div>
  <div class="slide" style="background-image:url('img6.jpg')"></div>
  <div class="slide" style="background-image:url('img7.jpg')"></div>
  <div class="slide" style="background-image:url('img8.jpg')"></div>

  <div class="overlay"></div>
</div>

<div class="text" id="finalText">kthehu shpirt ❤️</div>

<script>
  const slides = document.querySelectorAll('.slide');
  const text = document.getElementById('finalText');

  let index = 0;
  const interval = 3500; // Zeit pro Bild (ruhig!)

  function showNext() {
    slides[index].classList.remove('active');
    index++;

    if (index < slides.length) {
      slides[index].classList.add('active');
    } else {
      // letztes Bild bleibt
      slides[slides.length - 1].classList.add('active');
      setTimeout(() => text.classList.add('show'), 2500);
      clearInterval(timer);
    }
  }

  const timer = setInterval(showNext, interval);
</script>

</body>
</html>
