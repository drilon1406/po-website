<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>💖</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(135deg, #ff9ebc, #ffd1dc);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Hintergrundbild – GANZ sichtbar */
    .background {
      position: fixed;
      inset: 0;
      background-image: url('img8.jpg');
      background-repeat: no-repeat;
      background-position: center;
      background-size: contain; /* wichtig */
      z-index: 1;
    }

    /* leichte Abdunklung */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.18);
      z-index: 2;
    }

    /* Textbox */
    .box {
      position: absolute;
      bottom: 8%;
      left: 50%;
      transform: translateX(-50%);
      width: 92%;
      max-width: 440px;
      padding: 28px 26px;
      background: rgba(255,255,255,0.3);
      backdrop-filter: blur(10px);
      border-radius: 26px;
      text-align: center;
      color: white;
      z-index: 3;
      box-shadow: 0 20px 45px rgba(0,0,0,0.25);
    }

    h1 {
      font-size: 34px;
      font-weight: 700;
      margin-bottom: 14px;
    }

    p {
      font-size: 22px;
      line-height: 1.5;
      opacity: 0;
      transition: opacity 1.2s ease;
    }

    p.show {
      opacity: 1;
    }
  </style>
</head>

<body>

  <!-- Bild -->
  <div class="background"></div>
  <div class="overlay"></div>

  <!-- Text -->
  <div class="box">
    <h1>💖</h1>
    <p id="text"></p>
  </div>

  <script>
    const messages = [
      "Ti më bëre njeriun më të lumtur në botë 💖🥰",
      "Dua të të bëj një dhuratë 🎁✨",
      "Ndoshta jo perfekte… 💭",
      "Por është nga zemra ❤️",
      "Kthehu shpirt 💞"
    ];

    const textEl = document.getElementById("text");
    let index = 0;

    function showNextText() {
      if (index >= messages.length) return;

      textEl.classList.remove("show");
      setTimeout(() => {
        textEl.textContent = messages[index];
        textEl.classList.add("show");
        index++;
      }, 600);
    }

    // erster Text
    showNextText();

    // ruhiger Wechsel
    setInterval(showNextText, 5200);
  </script>

</body>
</html>
