<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Be My Valentine 💖</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Hintergrundmusik -->
  <audio autoplay loop>
    <source src="https://cdn.pixabay.com/audio/2023/03/06/audio_0f7b64c1e6.mp3" type="audio/mpeg">
  </audio>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Comic Sans MS', cursive;
      background: linear-gradient(135deg, #ffd6e8, #ffeef5);
      height: 100dvh;
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .card {
      background: white;
      width: 100%;
      height: 100%;
      padding: 24px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    h1 {
      color: #ff4d88;
      font-size: 26px;
      margin-bottom: 5px;
    }

    p {
      color: #888;
      margin: 4px 0 14px;
    }

    img {
      width: 120px;
      margin: 15px 0;
    }

    button {
      border: none;
      padding: 14px 26px;
      font-size: 18px;
      border-radius: 16px;
      cursor: pointer;
      margin: 8px;
      transition: all 0.25s ease;
    }

    .yes {
      background: #ff4d88;
      color: white;
    }

    .no {
      background: #ddd;
    }

    .heart {
      position: absolute;
      bottom: -20px;
      font-size: 24px;
      animation: floatUp 6s linear infinite;
      opacity: 0.7;
      pointer-events: none;
    }

    @keyframes floatUp {
      0% { transform: translateY(0); opacity: 0; }
      10% { opacity: 1; }
      100% { transform: translateY(-110vh); opacity: 0; }
    }
  </style>
</head>
<body>

<div class="card">
  <h1>Will you be my Valentine? 💘</h1>
  <p>Dionisa 💕</p>

  <img src="https://i.imgur.com/7yUvePI.png" alt="cute bear">

  <div>
    <button class="yes" id="yesBtn">Po 💕</button>
    <button class="no" id="noBtn">Jo 🙃</button>
  </div>
</div>

<script>
  const noBtn = document.getElementById("noBtn");
  const yesBtn = document.getElementById("yesBtn");

  const messages = [
    "Je e sigurt? 🥺",
    "Mendo edhe një herë… 💔",
    "Po ma thyen zemrën 😭",
    "Të lutem Dionisa 💕"
  ];

  let index = 0;

  noBtn.onclick = () => {
    noBtn.textContent = messages[index];

    if (index === messages.length - 1) {
      setTimeout(() => {
        noBtn.style.display = "none";
      }, 1200);
    }

    index = Math.min(index + 1, messages.length - 1);

    let size = window.getComputedStyle(yesBtn).fontSize;
    yesBtn.style.fontSize = (parseFloat(size) * 1.25) + "px";
  };

  yesBtn.onclick = () => {
    window.location.href = "yes.html";
  };

  function createHeart() {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.textContent = "💖";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (4 + Math.random() * 3) + "s";
    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 7000);
  }

  setInterval(createHeart, 450);
</script>

</body>
</html>
