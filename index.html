<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Be My Valentine 💖</title>

  <!-- Hinweis: iOS blockiert Autoplay oft. Musik startet dann erst nach Klick. -->
  <audio id="bgMusic" loop>
    <source src="https://cdn.pixabay.com/audio/2023/03/06/audio_0f7b64c1e6.mp3" type="audio/mpeg">
  </audio>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Comic Sans MS", cursive;
      background: linear-gradient(135deg, #ffd6e8, #ffeef5);
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: env(safe-area-inset-top) env(safe-area-inset-right)
               env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    .card {
      width: 100%;
      height: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 22px;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(6px);
    }

    h1 {
      margin: 6px 0 4px;
      color: #ff4d88;
      font-size: clamp(22px, 4.8vw, 30px);
      line-height: 1.15;
    }

    .name {
      margin: 0 0 14px;
      color: #777;
      font-size: clamp(14px, 3.5vw, 18px);
    }

    .photo {
      width: min(82vw, 320px);
      height: min(42vh, 360px);
      border-radius: 18px;
      object-fit: cover;
      box-shadow: 0 10px 25px rgba(0,0,0,0.18);
      margin: 10px 0 18px;
    }

    .buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
    }

    button {
      border: none;
      padding: 14px 26px;
      font-size: 18px;
      border-radius: 16px;
      cursor: pointer;
      transition: transform 0.18s ease, opacity 0.2s ease;
      user-select: none;
    }

    .yes {
      background: #ff4d88;
      color: white;
      box-shadow: 0 8px 18px rgba(255,77,136,0.35);
    }

    .no {
      background: #e7e7e7;
      color: #333;
    }

    button:active {
      transform: scale(0.98);
    }

    /* Herzen */
    .heart {
      position: absolute;
      bottom: -24px;
      font-size: 24px;
      animation: floatUp 6s linear infinite;
      opacity: 0.75;
      pointer-events: none;
    }

    @keyframes floatUp {
      0% { transform: translateY(0); opacity: 0; }
      12% { opacity: 1; }
      100% { transform: translateY(-110vh); opacity: 0; }
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Will you be my Valentine? 💘</h1>
    <p class="name">Dionisa 💕</p>

    <!-- DEIN FOTO (liegt als couple.jpg im Repo) -->
    <img class="photo" src="couple.jpg" alt="Us 💕">

    <div class="buttons">
      <button class="yes" id="yesBtn">Po 💕</button>
      <button class="no" id="noBtn">Jo 🙃</button>
    </div>
  </div>

  <script>
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const bgMusic = document.getElementById("bgMusic");

    // iOS: Musik startet oft erst nach Nutzer-Interaktion.
    function tryStartMusic() {
      bgMusic.play().catch(() => {});
      window.removeEventListener("click", tryStartMusic);
      window.removeEventListener("touchstart", tryStartMusic);
    }
    window.addEventListener("click", tryStartMusic);
    window.addEventListener("touchstart", tryStartMusic);

    const messages = [
      "Je e sigurt? 🥺",
      "Mendo edhe një herë… 💔",
      "Po ma thyen zemrën 😭",
      "Të lutem Dionisa 💕"
    ];

    let index = 0;

    noBtn.onclick = () => {
      // Text setzen
      noBtn.textContent = messages[index];

      // Yes-Button wächst leicht
      const size = parseFloat(window.getComputedStyle(yesBtn).fontSize);
      yesBtn.style.fontSize = (size * 1.22) + "px";

      // Wenn wir beim letzten Satz sind -> Nein verschwindet danach
      if (index === messages.length - 1) {
        setTimeout(() => {
          noBtn.style.opacity = "0";
          setTimeout(() => (noBtn.style.display = "none"), 250);
        }, 1100);
        return;
      }

      index++;
    };

    yesBtn.onclick = () => {
      window.location.href = "yes.html";
    };

    // Herz-Animation
    function createHeart() {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.textContent = "💖";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = (4 + Math.random() * 3) + "s";
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 7000);
    }
    setInterval(createHeart, 450);
  </script>
</body>
</html>
